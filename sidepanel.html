<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidearc</title>
  <link rel="stylesheet" href="sidepanel.css">
  <!-- 侧边栏用到的模块一次性并行加载,而不是一层层发现后再加载;src/ 下新增模块时记得加上 -->
  <link rel="modulepreload" href="src/folders.js">
  <link rel="modulepreload" href="src/i18n.js">
  <link rel="modulepreload" href="src/dom.js">
  <link rel="modulepreload" href="src/drag.js">
  <link rel="modulepreload" href="src/events.js">
  <link rel="modulepreload" href="src/items.js">
  <link rel="modulepreload" href="src/keys.js">
  <link rel="modulepreload" href="src/logic.js">
  <link rel="modulepreload" href="src/menus.js">
  <link rel="modulepreload" href="src/protocol.js">
  <link rel="modulepreload" href="src/render.js">
  <link rel="modulepreload" href="src/spaces.js">
  <link rel="modulepreload" href="src/store.js">
  <link rel="modulepreload" href="src/tabs.js">
  <link rel="modulepreload" href="src/ui.js">
</head>
<body>
  <header>
    <label class="search">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="search" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="搜索标签页或输入网址" spellcheck="false" autocomplete="off">
    </label>
    <!-- 收藏夹和空间名放在顶部、滚动区外面(和 Arc 一样):只有下面的固定标签和标签页列表滚动 -->
    <section id="favs" class="zone grid" data-zone="fav"></section>
    <div class="space-head">
      <span id="space-name"></span>
      <i id="space-private" class="badge" data-i18n-title="noHistoryBadgeTip" title="此空间不记录浏览历史" hidden>
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4z"/><circle cx="8" cy="8" r="1.8"/><path d="M3 13L13 3"/></svg>
        <span data-i18n="noHistoryBadge">不记录历史</span>
      </i>
      <!-- 搜索不常用,平时收成一个放大镜:点它或按 / 、⌘F 才在顶部展开搜索框(见 ui.js 的 openSearch) -->
      <button id="search-toggle" class="ghost" data-i18n-title="searchTip" title="搜索(/)">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      </button>
      <button id="space-menu" class="ghost" data-i18n-title="spaceSettings" title="空间设置">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/></svg>
      </button>
    </div>
  </header>

  <main id="scroll">
    <section id="pins" class="zone list" data-zone="pin"></section>

    <div class="divider">
      <span></span>
      <button id="clear" class="ghost" data-i18n="clear" data-i18n-title="clearTip" title="关闭此空间中除当前标签页外的所有未固定标签页">清理</button>
    </div>

    <button id="new-tab" class="row new">
      <span class="i"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></span>
      <span class="title" data-i18n="newTab">新标签页</span>
    </button>
    <section id="tabs" class="zone list" data-zone="tab"></section>
  </main>

  <footer id="spaces"></footer>

  <div id="toast" hidden></div>
  <div id="menu" hidden></div>
  <dialog id="dlg"></dialog>

  <script src="boot.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
